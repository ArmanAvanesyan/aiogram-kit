[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aiogram-idle-native"
version = "0.3.3"
description = "Optional deterministic Rust core for aiogram-idle"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "Arman Avanesyan"}]
classifiers = ["Programming Language :: Rust", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/ArmanAvanesyan/aiogram-kit/tree/main/packages/aiogram-idle/native"
Repository = "https://github.com/ArmanAvanesyan/aiogram-kit"
Issues = "https://github.com/ArmanAvanesyan/aiogram-kit/issues"
Documentation = "https://armanavanesyan.github.io/aiogram-kit/libraries/aiogram-idle/"
Changelog = "https://github.com/ArmanAvanesyan/aiogram-kit/blob/main/packages/aiogram-idle/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "aiogram_idle_native._aiogram_idle_native"
python-packages = ["aiogram_idle_native"]
features = ["pyo3/extension-module"]
include = [
    {path = "Cargo.lock", format = "sdist"},
    {path = "benches/**", format = "sdist"},
    {path = "tests/**", format = "sdist"},
]
