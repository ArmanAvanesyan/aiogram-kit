name: Publish verified aiogram-kit
permissions:
  contents: read
concurrency:
  group: publish-aiogram-kit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'aiogram-kit-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
    - name: Download the exact reviewed release artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release download "$GITHUB_REF_NAME" --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS --dir dist
    - name: Validate tag, distribution names and independently supplied checksums
      env:
        MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      run: python tools/verify_release.py --package aiogram-kit --tag "$GITHUB_REF_NAME" --dist dist --manifest-sha256 "$MANIFEST_SHA256"
    - run: uvx twine check dist/*.whl dist/*.tar.gz
    - uses: actions/upload-artifact@v6
      with:
        name: verified-distributions
        path: |
          dist/*.whl
          dist/*.tar.gz
          dist/SHA256SUMS
        if-no-files-found: error
      id: artifacts
    outputs:
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        artifact-ids: ${{ needs.verify.outputs.artifact_id }}
        path: verified-input
        merge-multiple: true
    - name: Recheck the reviewed manifest after artifact download
      env:
        RELEASE_PACKAGE: aiogram-kit
        RELEASE_TAG: ${{ github.ref_name }}
        MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      run: |
        python3 - <<'PYTHON'
        import hashlib
        import os
        import re
        import shutil
        from pathlib import Path

        package = os.environ["RELEASE_PACKAGE"]
        tag = os.environ["RELEASE_TAG"]
        prefix = package + "-v"
        if not tag.startswith(prefix):
            raise ValueError("Incorrect package tag")
        version = tag[len(prefix):]
        normalized = package.replace("-", "_")
        expected = {f"{normalized}-{version}-py3-none-any.whl", f"{normalized}-{version}.tar.gz"}
        source = Path("verified-input")
        if {p.name for p in source.iterdir()} != expected | {"SHA256SUMS"}:
            raise ValueError("Unexpected handoff files")
        if any(p.is_symlink() or not p.is_file() for p in source.iterdir()):
            raise ValueError("Handoff must contain regular files")
        manifest = source / "SHA256SUMS"
        if hashlib.sha256(manifest.read_bytes()).hexdigest() != os.environ["MANIFEST_SHA256"]:
            raise ValueError("Handoff manifest checksum mismatch")
        checked = set()
        for line in manifest.read_text().splitlines():
            digest, filename = line.split()
            if filename not in expected or filename in checked or not re.fullmatch(r"[a-f0-9]{64}", digest):
                raise ValueError("Invalid handoff manifest entry")
            if hashlib.sha256((source / filename).read_bytes()).hexdigest() != digest:
                raise ValueError("Handoff distribution checksum mismatch")
            checked.add(filename)
        if checked != expected:
            raise ValueError("Incomplete handoff")
        destination = Path("dist")
        destination.mkdir()
        for filename in sorted(expected):
            shutil.copyfile(source / filename, destination / filename)
        PYTHON
    - name: Publish verified distributions using PyPI Trusted Publishing
      uses: pypa/gh-action-pypi-publish@release/v1
'on':
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA256 of the independently verified GitHub release SHA256SUMS
        required: true
        type: string
